version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: factory_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factory_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/factory_db
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  postgres_data:
